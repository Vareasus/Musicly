name: musicly

services:
  app:
    build: .
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=musiclydb;Username=postgres;Password=Hundiba123      
      - Redis__Connection=redis:6379

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redisdata:/data
    

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: musiclydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Hundiba123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  nginx:
    image: nginx 
    container_name: musicly-nginx
    ports:
      - "80:80"
    volumes:
      - /opt/apps/Musicly/conf/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - app 
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
